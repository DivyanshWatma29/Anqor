version: '3.8'

services:
  # Production service
  anqor-prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    image: anqor:${TAG:-latest}
    container_name: anqor-prod
    restart: unless-stopped
    ports:
      - "8787:8787"
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
    networks:
      - anqor-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy for zero-downtime
  nginx:
    image: nginx:alpine
    container_name: anqor-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - anqor-prod
    networks:
      - anqor-network

networks:
  anqor-network:
    driver: bridge
