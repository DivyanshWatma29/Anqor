[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anqor-benchmark"
version = "0.1.0"
description = "Framework-neutral ML evaluation and release gates for Anqor."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Divyansh Watma"}]
license = {text = "MIT"}
keywords = ["machine-learning", "mlops", "model-evaluation", "responsible-ai", "drift", "calibration", "release-gate"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
anqor = "anqor_benchmark.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
