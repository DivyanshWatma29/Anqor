name: Anqor Evaluate
description: Evaluate ML predictions and optionally enforce release metrics in CI.
author: Divyansh Watma
branding:
  icon: shield
  color: blue
inputs:
  predictions:
    description: Path to a CSV containing y_true and y_score columns
    required: true
  threshold:
    description: Classification threshold
    required: false
    default: '0.5'
  gate:
    description: Inline JSON metric gate, for example {"f1":{"min":0.75}}
    required: false
    default: ''
  gate-file:
    description: Path to a JSON gate-policy file in the checked-out repository
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ./python/anqor_benchmark
    - shell: bash
      env:
        PREDICTIONS: ${{ inputs.predictions }}
        THRESHOLD: ${{ inputs.threshold }}
        GATE: ${{ inputs.gate }}
        GATE_FILE: ${{ inputs.gate-file }}
      run: |
        args=(anqor evaluate "$PREDICTIONS" --threshold "$THRESHOLD")
        if [ -n "$GATE" ]; then
          args+=(--gate "$GATE")
        fi
        if [ -n "$GATE_FILE" ]; then
          args+=(--gate-file "$GATE_FILE")
        fi
        if [ -n "$GATE" ] && [ -n "$GATE_FILE" ]; then
          echo "gate and gate-file are mutually exclusive" >&2
          exit 1
        fi
        "${args[@]}"
