name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  BUN_VERSION: '1.3.13'

jobs:
  # ==========================================
  # TEST JOB - Runs on every PR and push
  # ==========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run type check
        run: bunx tsc --noEmit

      - name: Run unit tests
        run: bun run test -- --coverage

      - name: Upload test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ==========================================
  # BUILD JOB - Verify build works
  # ==========================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build for production
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 30

  # ==========================================
  # STAGING DEPLOY - Auto-deploy from develop/staging branch
  # ==========================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create .env for staging
        run: |
          cat > .env << EOF
          NODE_ENV=staging
          PORT=8787
          SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_API_BASE_URL=${{ vars.STAGING_URL }}
          EOF

      - name: Build for staging
        run: bun run build:dev
        env:
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ vars.STAGING_URL }}

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/anqor-staging
            git pull origin staging
            bun install --frozen-lockfile
            bun run build:dev
            pm2 reload anqor-staging || pm2 start server/bff.js --name anqor-staging
            sleep 5
            curl -f http://localhost:8788/health || exit 1

  # ==========================================
  # PRODUCTION DEPLOY - Only from main branch
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            # Create deployment directory with timestamp
            DEPLOY_DIR="/opt/deployments/anqor-$(date +%Y%m%d-%H%M%S)"
            mkdir -p $DEPLOY_DIR

            # Clone and build
            cd /opt/anqor
            git fetch origin main
            git checkout main
            git pull origin main

            # Install dependencies
            bun install --frozen-lockfile

            # Build with production env
            bun run build

            # Health check before switching
            pm2 reload anqor --update-env

            # Wait for health check
            sleep 10
            for i in {1..30}; do
              if curl -f http://localhost:8787/health; then
                echo "✅ Health check passed"
                exit 0
              fi
              echo "⏳ Waiting for health check... ($i/30)"
              sleep 2
            done

            # Rollback on failure
            echo "❌ Health check failed, initiating rollback"
            pm2 rollback anqor
            exit 1

      - name: Notify deployment success
        if: success()
        run: echo "✅ Production deployment successful!"

      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Production deployment failed! Check logs for rollback status."
