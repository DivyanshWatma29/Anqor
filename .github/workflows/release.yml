name: Release Anqor Benchmark

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("python/anqor_benchmark/pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v$VERSION"
      - run: python -m pip install --upgrade pip build pytest twine
      - run: python -m pip install -e './python/anqor_benchmark[dev]'
      - run: pytest
      - run: python -m build python/anqor_benchmark
      - run: python -m twine check python/anqor_benchmark/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: anqor-benchmark-dist
          path: python/anqor_benchmark/dist/*

  publish:
    needs: build
    if: ${{ vars.ANQOR_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: anqor-benchmark-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
