name: Model Evaluation Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/**'
      - 'python/anqor_benchmark/**'
      - '.github/actions/evaluate/**'

permissions:
  contents: read

jobs:
  evaluate-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate reference predictions
        uses: ./.github/actions/evaluate
        with:
          predictions: examples/predictions.csv
          threshold: '0.5'
          gate-file: examples/release-policy.json
