name: ModelFort Evaluate
description: Evaluate ML predictions and optionally enforce release metrics in CI.
author: Divyansh Watma
branding:
  icon: shield
  color: blue
inputs:
  python-version:
    description: Python version used by the action
    required: false
    default: '3.12'
  predictions:
    description: Path to a CSV containing y_true and y_score columns
    required: true
  threshold:
    description: Classification threshold
    required: false
    default: '0.5'
  gate:
    description: JSON metric gate, for example {"f1":{"min":0.75}}
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ./python/anqor_benchmark
    - shell: bash
      env:
        PREDICTIONS: ${{ inputs.predictions }}
        THRESHOLD: ${{ inputs.threshold }}
        GATE: ${{ inputs.gate }}
      run: |
        if [ -n "$GATE" ]; then
          modelfort evaluate "$PREDICTIONS" --threshold "$THRESHOLD" --gate "$GATE"
        else
          modelfort evaluate "$PREDICTIONS" --threshold "$THRESHOLD"
        fi
