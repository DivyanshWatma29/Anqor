version: "3.8"

services:
  - type: web
    name: anqor-ml-service
    env: docker
    plan: free
    region: oregon
    rootDir: ml-service
    envVars:
      - key: HUGGING_FACE_TOKEN
        sync: false

  - type: web
    name: anqor-bff
    env: node
    plan: free
    region: oregon
    buildCommand: bun install
    startCommand: node server/bff.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: INSFORGE_URL
        sync: false
      - key: INSFORGE_ANON_KEY
        sync: false
      - key: ML_SERVICE_URL
        fromService:
          name: anqor-ml-service
          type: web
          property: url
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: HUGGING_FACE_TOKEN
        sync: false
