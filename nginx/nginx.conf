events {
    worker_connections 1024;
}

http {
    upstream anqor_backend {
        # Zero-downtime: keep serving while backend reloads
        server 127.0.0.1:8787 max_fails=3 fail_timeout=30s;
    }

    upstream anqor_staging_backend {
        server 127.0.0.1:8788 max_fails=3 fail_timeout=30s;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    server {
        listen 80;
        server_name anqor.com www.anqor.com;

        # Redirect to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name anqor.com www.anqor.com;

        # SSL configuration (managed by certbot)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Production site
        location / {
            proxy_pass http://anqor_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Timeout settings for zero-downtime
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://anqor_backend;
            access_log off;
        }

        # API with rate limiting
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://anqor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auth endpoints with stricter rate limiting
        location /api/v1/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://anqor_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # Staging server block
    server {
        listen 443 ssl http2;
        server_name staging.anqor.com;

        ssl_certificate /etc/nginx/ssl/staging-fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/staging-privkey.pem;

        location / {
            proxy_pass http://anqor_staging_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://anqor_staging_backend;
            access_log off;
        }
    }
}
